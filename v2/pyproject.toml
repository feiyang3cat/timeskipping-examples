[project]
name = "timeskipping-v2-examples"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "temporalio",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.4",
]

[tool.uv.sources]
temporalio = { git = "https://github.com/temporalio/sdk-python.git", branch = "main" }

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = [".."]
testpaths = ["test_workflow.py", "test_workflow_direct_api.py", "test_activity_time_skipping.py", "test_activity_time_skipping_direct_api.py"]
timeout = 60
timeout_method = "thread"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]

[tool.ruff]
target-version = "py310"
