[project]
name = "timeskipping-v1-examples"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.27",
    "pytest>=8",
    "pytest-asyncio>=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]
